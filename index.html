<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>የኪራይ እና ሽያጭ ሚኒ አፕ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f4f6f8; color: #333; padding-bottom: 70px; }
        
        /* Header Banner */
        .header { background: linear-gradient(135deg, #6b11ff, #2575fc); color: white; padding: 20px; text-align: center; border-bottom-left-radius: 15px; border-bottom-right-radius: 15px; }
        .header h1 { font-size: 20px; margin-bottom: 5px; }
        .header p { font-size: 13px; opacity: 0.9; }

        /* Filter Tabs */
        .categories { display: flex; justify-content: space-around; background: white; margin: 15px; padding: 10px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .tab { font-size: 14px; font-weight: bold; color: #666; border: none; background: none; cursor: pointer; padding: 5px 10px; }
        .tab.active { color: #2575fc; border-bottom: 2px solid #2575fc; }

        /* Listing Cards */
        .container { padding: 0 15px; }
        .card { background: white; border-radius: 12px; overflow: hidden; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 12px; }
        .card-title { font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .card-price { color: #2575fc; font-weight: bold; font-size: 15px; margin-bottom: 8px; }
        .card-desc { font-size: 12px; color: #666; margin-bottom: 10px; }
        .btn-contact { display: block; text-align: center; background: #2575fc; color: white; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; }

        /* Floating Add Button (+) */
        .add-btn { position: fixed; bottom: 20px; right: 20px; background: #2575fc; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: none; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>የኪራይ እና ሽያጭ ማዕከል</h1>
        <p>ያለ ደላላ በቀጥታ ከባለቤቱ ጋር ይገናኙ</p>
    </div>

    <div class="categories">
        <button class="tab active">ሁሁሉም</button>
        <button class="tab">ቤቶች</button>
        <button class="tab">መኪኖች</button>
    </div>

    <div class="container">
        <!-- Sample Item 1 -->
        <div class="card">
            <img src="https://via.placeholder.com/400x200" alt="መኪና">
            <div class="card-body">
                <div class="card-title">የሚከራይ መኪና (Renault)</div>
                <div class="card-price">2,850 ብር / በቀን</div>
                <div class="card-desc">በጣም በጥሩ ሁኔታ ላይ ያለ፣ አነስተኛ ነዳጅ የሚበላ።</div>
                <a href="https://t.me/Tewe4500" class="btn-contact">ባለቤቱን ያናግሩ</a>
            </div>
        </div>

        <!-- Sample Item 2 -->
        <div class="card">
            <img src="https://via.placeholder.com/400x200" alt="ቤት">
            <div class="card-body">
                <div class="card-title">ባለ 1 መኝታ ኮንዶሚኒየም ቤት</div>
                <div class="card-price">28,000 ብር / በወር</div>
                <div class="card-desc">3ኛ ፎቅ፣ የራሱ ቆጣሪ ያለው፣ 24 ሰዓት ውሃ ያለው።</div>
                <a href="https://t.me/Tewe4500" class="btn-contact">ባለቤቱን ያናግሩ</a>
            </div>
        </div>
    </div>

    <button class="add-btn" onclick="alert('ማስታወቂያ መጫኛ ቅጽ እዚህ ይከፈታል!')">+</button>

    <script>
        // Telegram Mini App Initialization
        const tg = window.Telegram.WebApp;
        tg.expand();
    </script>
</body>
</html>
