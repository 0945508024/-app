<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ኩሉ ብሓደ - ማስታወቂያ መPostMapping</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 15px;
            margin: 0;
        }
        h2 { text-align: center; color: #0088cc; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>አዲስ ማስታወቂያ ማስገቢያ</h2>

    <form id="listingForm">
        <div class="form-group">
            <label for="category">ዘርፍ (Category)</label>
            <select id="category" required>
                <option value="የቤት ኪራይ/ሽያጭ">የቤት ኪራይ/ሽያጭ</option>
                <option value="የመኪና ኪራይ/ሽያጭ">የመኪና ኪራይ/ሽያጭ</option>
                <option value="ሌሎች">ሌሎች</option>
            </select>
        </div>

        <div class="form-group">
            <label for="title">ርዕስ (Title)</label>
            <input type="text" id="title" placeholder="ለምሳሌ፦ ቪላ ቤት የሚከራይ" required>
        </div>

        <div class="form-group">
            <label for="price">ዋጋ (Price in ETB)</label>
            <input type="number" id="price" placeholder="ለምሳሌ፦ 15000" required>
        </div>

        <div class="form-group">
            <label for="description">ዝርዝር መግለጫ (Description)</label>
            <textarea id="description" rows="3" placeholder="ስለ እቃው ወይም ቤቱ ማብራሪያ..."></textarea>
        </div>

        <button type="submit">መረጃውን ላክ</button>
    </form>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // አፑን በሙሉ ስክሪን ይከፍታል

        document.getElementById('listingForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const formData = {
                category: document.getElementById('category').value,
                title: document.getElementById('title').value,
                price: document.getElementById('price').value,
                description: document.getElementById('description').value
            };

            // መረጃውን ወደ Telegram Bot መላክ
            tg.sendData(JSON.stringify(formData));

            // አፑን መዝጋት
            tg.close();
        });
    </script>
</body>
</html>
